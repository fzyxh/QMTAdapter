[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qmt-adapter"
version = "0.6.4"
description = "A broker-independent external Python client for the desktop QMT trading platform"
readme = "README.md"
requires-python = ">=3.7"
dependencies = []

[project.scripts]
qmt-adapter = "qmt_adapter.cli:main"

[tool.setuptools.packages.find]
include = ["qmt_adapter*", "qmt_side*"]

[tool.setuptools.package-data]
qmt_adapter = ["py.typed"]
